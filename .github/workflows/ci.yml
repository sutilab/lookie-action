name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; no secrets are used. Never switch this to pull_request_target: that would run
# a fork's code with write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, test, and the committed bundle matches the sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ matches a fresh build
        run: git diff --exit-code dist || { echo "::error::Run npm run build and commit dist/"; exit 1; }
      - run: npm audit --omit=dev --audit-level=high
